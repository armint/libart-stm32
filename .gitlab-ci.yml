stages:
  - test

image: "docker.vandertogt.org/firmware-builder:v1.14.0"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

# Runs the host-native unit tests under tests/ (doctest). These cover the
# hardware-independent logic (currently power::PowerManager), without needing
# a cross toolchain or the rest of the embedded dependency graph.
#
# This repo's embedded sources (art-stm32 proper) statically link
# system-stm32 and are RTOS-agnostic. Building the full embedded target is
# exercised by downstream projects (such as sentinode-ht), which build this
# repo as a submodule.
unit-tests:
  stage: test
  variables:
    GIT_DEPTH: 0
  script:
    - cmake -S tests -B build-tests -G "Unix Makefiles" -D CMAKE_BUILD_TYPE=Release
    - cmake --build build-tests -j$(nproc)
    - ctest --test-dir build-tests --output-on-failure
